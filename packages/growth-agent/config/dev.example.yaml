version: 1
timezone: Europe/London
dailyReport: { hour: 7, minute: 0, missedRunHours: 6 }
paths:
  state: ../../.runtime/state
  artifacts: ../../.runtime/artifacts
  workspace: ../..
limits:
  maxConcurrentHeavyJobs: 1
  approvalMinutes: 15
  dailyWritesPerPlatform: 0
  diskWarnPercent: 20
  diskBlockHeavyPercent: 15
  diskCriticalPercent: 10
  thermalPauseCelsius: 75
connectors: { reddit: disabled, x: disabled, rednote: disabled, dryRunUntil: null }
sources:
  hackernews: { enabled: false, maxItems: 10 }
